[project]
name = "moment-rag"
version = "0.1.0"
description = "Baseline semantic-search RAG vs. Moment RAG over one YouTube transcript"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.40",
    "youtube-transcript-api>=1.0",
    "qdrant-client[fastembed]>=1.12",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moment_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Submitted Part 1 notebook: course scaffold code, kept exactly as submitted
extend-exclude = ["notebooks/001_agentic_router.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
